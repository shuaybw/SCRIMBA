<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        
        <div>
            <h3>HOME</h3>
            <h4 class="h4-number" id="h4-home-number">0</h4>
            <button class="btn" onclick="homeIncrement1()">+1</button>
            <button class="btn" onclick="homeIncrement2()">+2</button>
            <button class="btn" onclick="homeIncrement3()">+3</button>
            <button class="btn" onclick="homeReset()">0</button>
        </div>

        
        <div>
            <H3>GUEST</H3>
            <h4 class="h4-number" id="h4-guest-number">0</h4>
            <button class="btn" onclick="guestIncrement1()">+1</button>
            <button class="btn" onclick="guestIncrement2()">+2</button>
            <button class="btn" onclick="guestIncrement3()">+3</button>
            <button class="btn" onclick="guestReset()">0</button>
        </div>
        

    </div>
    <script src="index.js"></script>
</body>
</html>
